specVersion: 1.2.0
description: Swaps of the Uniswap v3 pools Aquascan uses as same-chain price
  references on Base.
repository: https://github.com/raouf2ouf/naumachy
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: WethUsdc100
    network: base
    source:
      address: "0xb4cb800910b228ed3d0834cf79d697127bbb00e5"
      abi: UniswapV3Pool
      startBlock: 49700000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - Pool
        - Swap
        - PoolDayData
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/mapping.ts
