# Aqua registry subgraph. This file is the Base instance; `graph build --network <name>
# --network-file networks.json` rewrites addresses, start blocks and the network name
# from networks.json for the other chains. Both registries share one ABI and one set
# of handlers; the handler reads `event.address` to tag entities with their registry.
specVersion: 1.2.0
description: Aqua registry on one chain. Makers, strategies, fills and legs, from both the canonical and the legacy registry.
repository: https://github.com/raouf2ouf/naumachy
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: AquaCanonical
    network: base
    source:
      address: "0x1111113ccf1426a8e30e2bff5e005d929bf6a90a"
      abi: Aqua
      startBlock: 48839900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Maker
        - App
        - Template
        - Desk
        - Strategy
        - Fill
        - Leg
        - DailyStrategyStat
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
      file: ./src/mapping.ts
  - kind: ethereum
    name: AquaLegacy
    network: base
    source:
      address: "0x499943e74fb0ce105688beee8ef2abec5d936d31"
      abi: Aqua
      startBlock: 38495747
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Maker
        - App
        - Template
        - Desk
        - Strategy
        - Fill
        - Leg
        - DailyStrategyStat
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
      file: ./src/mapping.ts
