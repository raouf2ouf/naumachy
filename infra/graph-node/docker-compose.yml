# Local graph-node for one chain. Copy .env.example to .env and set GRAPH_RPC to an
# endpoint that serves wide historical eth_getLogs ranges and eth_getBlockReceipts
# (Tenderly's gateway does). The network name must match the subgraph manifest.
#
#   docker compose up -d            # graph-node, ipfs, postgres
#   curl localhost:8030/graphql     # indexing status
#   http://localhost:8000/subgraphs/name/naumachy/aqua/graphql
services:
  graph-node:
    image: graphprotocol/graph-node:latest
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      ethereum: "${GRAPH_NETWORK:-base}:${GRAPH_RPC:?set GRAPH_RPC in infra/graph-node/.env}"
      GRAPH_LOG: info
      GRAPH_ETHEREUM_MAX_BLOCK_RANGE_SIZE: "${GRAPH_MAX_RANGE:-100000}"
      ETHEREUM_POLLING_INTERVAL: "2000"
      # Head blocks are loaded with all their receipts. Batched and bounded, so an
      # endpoint is never hit with a thousand concurrent receipt requests.
      GRAPH_ETHEREUM_FETCH_TXN_RECEIPTS_IN_BATCHES: "true"
      GRAPH_ETHEREUM_BLOCK_INGESTOR_MAX_CONCURRENT_JSON_RPC_CALLS_FOR_TXN_RECEIPTS: "20"
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - "5001:5001"
    volumes:
      - ../data/graph-node/ipfs:/data/ipfs
  postgres:
    image: postgres:16
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements", "-cmax_connections=200"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ../data/graph-node/postgres:/var/lib/postgresql/data
