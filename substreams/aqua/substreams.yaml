specVersion: v0.1.0
package:
  name: naumachy_aqua
  version: v0.1.0
  url: https://github.com/raouf2ouf/naumachy
  description: Every event of the 1inch Aqua registries, decoded, for the chains The Graph reaches only through Firehose

imports:
  ethcommon: https://spkg.io/streamingfast/ethereum-common-v0.3.3.spkg

protobuf:
  files:
    - aqua.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - sf/ethereum
    - sf/firehose
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:
  - name: map_events
    kind: map
    initialBlock: 13888204
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x1111113ccf1426a8e30e2bff5e005d929bf6a90a || evt_addr:0x499943e74fb0ce105688beee8ef2abec5d936d31
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:naumachy.aqua.v1.Events

network: robinhood
